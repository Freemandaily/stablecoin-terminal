connector.name=iceberg
# Same catalog pattern as the reference backend: Trino's Iceberg JDBC catalog.
# Postgres holds only namespace/table pointers; the rows stay in GCS.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=${ENV:PG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:PG_PASSWORD}
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.default-warehouse-dir=gs://term-flow/warehouse
iceberg.register-table-procedure.enabled=true
fs.gcs.enabled=true
gcs.auth-type=APPLICATION_DEFAULT
