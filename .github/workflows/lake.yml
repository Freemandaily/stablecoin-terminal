# Bronze (GCS raw) → Iceberg → dbt-spark, submitted as Dataproc Serverless batches.
#
# The two batches are separate jobs: build_iceberg can run on its own, and
# dbt_spark can run on its own by setting `lake_command=none`. When both run,
# dbt waits for the Iceberg build to succeed.
#
# Auth: GCP_SA_KEY (service-account JSON) needs:
#   roles/dataproc.editor on the project, roles/storage.objectAdmin on
#   gs://term-flow, and the compute service account needs storage read/write.
#
# No --async: each submit waits, so a failed Spark/dbt batch fails the job.
#
# Triggered by ingest.yml after each successful ingest lane, or manually via
# workflow_dispatch. There is no fixed lake cron — the ingest schedule is the
# clock, and the build always uses the date that ingest just wrote.

name: Lake build (Iceberg + dbt-spark)

on:
  workflow_dispatch:
    inputs:
      lake_command:
        description: Run the Iceberg build batch
        type: choice
        default: build
        options: [build, none]
      table:
        description: Which bronze tables to rebuild
        type: choice
        default: raw_issuer_events
        options:
          - raw_issuer_events
          - others
          - all
      start_date:
        description: Optional inclusive rebuild start (YYYY-MM-DD); blank = auto-discover
        type: string
        required: false
      end_date:
        description: Optional inclusive rebuild end (YYYY-MM-DD); blank = auto-discover
        type: string
        required: false
      force:
        description: Rebuild discovered dates even if their manifest fingerprint is unchanged
        type: boolean
        default: false
      dbt_command:
        description: dbt batch to run after the Iceberg build (none = skip)
        type: choice
        default: run
        options: [none, run, test, build]
  # ingest.yml dispatches this after each successful ingest lane. Manual
  # workflow_dispatch remains available with all inputs below.
  repository_dispatch:
    types: [ingest-complete]

permissions:
  contents: read

concurrency:
  group: lake-build
  cancel-in-progress: false # never interrupt a half-written Iceberg/dbt run

env:
  PROJECT: analytic-sages-data-portal
  REGION: us-central1
  BUCKET: term-flow
  # build_iceberg.py configures its own catalog in lake/lib/spark_session.py:
  # it sets catalog-impl, so `...catalog.iceberg.type=hadoop` must NOT be
  # passed here (Iceberg rejects type + catalog-impl together). No session
  # extensions are requested: Dataproc 2.1 loads them too early and the bridge
  # deliberately avoids MERGE (see build_iceberg.py).
  LAKE_SPARK_PROPERTIES: '^#^spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,com.google.cloud.bigdataoss:gcs-connector:hadoop3-2.2.11,org.apache.iceberg:iceberg-gcp-bundle:1.6.1,org.scala-lang:scala-library:2.12.18'
  # run_dbt.py needs both catalog aliases but no Iceberg session extensions:
  # Dataproc 2.1 loads them too early and these table models never use MERGE.
  DBT_SPARK_PROPERTIES: '^#^spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,com.google.cloud.bigdataoss:gcs-connector:hadoop3-2.2.11,org.apache.iceberg:iceberg-gcp-bundle:1.6.1,org.scala-lang:scala-library:2.12.18#spark.sql.session.timeZone=UTC#spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkCatalog#spark.sql.catalog.spark_catalog.type=hadoop#spark.sql.catalog.spark_catalog.warehouse=gs://term-flow/warehouse#spark.sql.catalog.spark_catalog.io-impl=org.apache.iceberg.hadoop.HadoopFileIO#spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog#spark.sql.catalog.iceberg.type=hadoop#spark.sql.catalog.iceberg.warehouse=gs://term-flow/warehouse#spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.hadoop.HadoopFileIO#spark.sql.warehouse.dir=gs://term-flow/warehouse'

jobs:
  build_iceberg:
    if: github.event_name != 'workflow_dispatch' || inputs.lake_command != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build Iceberg from GCS raw
        shell: bash
        run: |
          set -euo pipefail
          # Manual runs keep the existing input behaviour. Dispatch runs build
          # all tables for the exact date the ingest lane just wrote; unchanged
          # tables are skipped by manifest fingerprints.
          table="${{ inputs.table }}"
          if [[ -z "$table" ]]; then table=all; fi
          start="${{ inputs.start_date }}"
          end="${{ inputs.end_date }}"
          if [[ "${{ github.event_name }}" == 'repository_dispatch' ]]; then
            day="${{ github.event.client_payload.date }}"
            if [[ -z "$day" ]]; then day="$(date -u +%F)"; fi
            start="$day"; end="$day"
          fi
          echo "build table=$table start=${start:-auto} end=${end:-auto} lane=${{ github.event.client_payload.lane }}"
          args=(--table "$table" --bucket "$BUCKET")
          if [[ -n "$start" && -n "$end" ]]; then
            args+=(--start-date "$start" --end-date "$end")
          fi
          if [[ "${{ inputs.force }}" == 'true' ]]; then
            args+=(--force)
          fi
          gcloud dataproc batches submit pyspark "gs://$BUCKET/code/build_iceberg.py" \
            --project="$PROJECT" --region="$REGION" --version=2.1 \
            --py-files="gs://$BUCKET/code/stableflow-lib.zip" \
            --properties="$LAKE_SPARK_PROPERTIES" \
            -- "${args[@]}"

  dbt_spark:
    needs: build_iceberg
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.dbt_command != 'none') &&
      (needs.build_iceberg.result == 'success' || needs.build_iceberg.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run dbt-spark
        shell: bash
        run: |
          set -euo pipefail
          gcloud dataproc batches submit pyspark "gs://$BUCKET/code/run_dbt.py" \
            --project="$PROJECT" --region="$REGION" --version=2.1 \
            --archives="gs://$BUCKET/code/dbt_spark_v2.zip#dbt_spark_v2" \
            --properties="$DBT_SPARK_PROPERTIES" \
            -- "${{ inputs.dbt_command || 'run' }}"
