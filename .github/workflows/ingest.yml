# Raw ingest in GitHub Actions (B-D50).
#
# Auth: service-account JSON key stored as a GitHub repository secret.
#   google-github-actions/auth@v2 exports GOOGLE_APPLICATION_CREDENTIALS for
#   the google-cloud-storage client used by backend/ingest/sinks.py — no code
#   change; the same ADC path as local runs.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   Secret:  GCP_SA_KEY = full contents of the service-account JSON file
#   Variable: BQ_PROJECT = <gcp project id for BigQuery jobs>   (optional)
#   Other secrets (only for the jobs that need them):
#     ARKHAM_API_KEY, CRYPTOLABEL_API_KEY, ETH_RPC_URL
#
# The service account needs roles/storage.objectAdmin on gs://term-flow.
# Rotate GCP_SA_KEY periodically; never commit the JSON file to the repo.
#
# Lane scheduling is handled by Cloudflare Cron Triggers, which dispatch this
# workflow with job=snapshot or job=onchain (UTC). Manual runs still work.
# A successful run dispatches `ingest-complete` to lake.yml.

name: Ingest raw data (Postgres / GCS)

on:
  workflow_dispatch:
    inputs:
      sink:
        description: Destination for raw payloads
        type: choice
        default: gcs
        options: [gcs, both, postgres]
      job:
        description: Ingest job (snapshot/onchain = scheduled lanes, all-gcs = full chain)
        type: choice
        default: all-gcs
        options:
          - all-gcs
          - snapshot
          - onchain
          - ingest-prices
          - ingest-supply
          - ingest-addresses
          - ingest-logos
          - ingest-issuer-events
          - enrich-labels
          - enrich-balances
      ingest_date:
        description: Optional GCS backfill date (YYYY-MM-DD); blank = UTC today
        type: string
        required: false
      source:
        description: Label source used by enrich-labels
        type: choice
        default: arkham
        options: [arkham, cryptolabel]
  # GitHub's schedule trigger is disabled for now: Cloudflare Cron Triggers are
  # the clock and dispatch job=snapshot / job=onchain via workflow_dispatch.
  # Re-enable only if the external scheduler is unavailable.

permissions:
  contents: write # needed to dispatch the lake build after a successful ingest

concurrency:
  group: ingest-${{ inputs.job || 'manual' }}-${{ inputs.sink || 'gcs' }}
  cancel-in-progress: false # never interrupt a half-written Parquet manifest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      # Only used when RAW_SINK includes Postgres; harmless but idle in gcs mode.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stableflow
          POSTGRES_PASSWORD: stableflow
          POSTGRES_DB: stableflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stableflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: stableflow
      PGPASSWORD: stableflow
      PGDATABASE: stableflow
      RAW_SINK: ${{ inputs.sink || 'gcs' }}
      GCS_BUCKET: term-flow
      GCS_PREFIX: raw
      GCS_INGEST_DATE: ${{ inputs.ingest_date }}
      BQ_PROJECT: ${{ vars.BQ_PROJECT }}
      ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
      CRYPTOLABEL_API_KEY: ${{ secrets.CRYPTOLABEL_API_KEY }}
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      SOURCE: ${{ inputs.source || 'arkham' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (service-account key)
        if: env.RAW_SINK != 'postgres'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Apply migrations (Postgres modes only)
        if: env.RAW_SINK != 'gcs'
        run: make migrate

      - name: Run ingest job
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job || 'all-gcs' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == 'schedule' ]]; then
            if [[ "$SCHEDULE" == '10 22 * * *' ]]; then
              # Legacy schedule branch — only if GitHub cron is re-enabled.
              jobs=(ingest-supply ingest-addresses ingest-logos ingest-prices)
            else
              jobs=(ingest-issuer-events enrich-labels enrich-balances)
            fi
          else
            case "$JOB" in
              snapshot)
                # Slow reference lane — snapshots, addresses, logos, prices.
                jobs=(ingest-supply ingest-addresses ingest-logos ingest-prices)
                ;;
              onchain)
                # Fast onchain lane — event feeds, then labels and balances.
                jobs=(ingest-issuer-events enrich-labels enrich-balances)
                ;;
              all-gcs)
                # Manual full chain.
                jobs=(ingest-supply ingest-addresses ingest-logos ingest-prices ingest-issuer-events enrich-labels enrich-balances)
                ;;
              *)
                jobs=("$JOB")
                ;;
            esac
          fi

          for j in "${jobs[@]}"; do
            echo "::group::$j"
            make "$j"
            echo "::endgroup::"
          done

      - name: Trigger lake build after successful ingest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job || 'all-gcs' }}
          DAY: ${{ inputs.ingest_date }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == 'schedule' ]]; then
            if [[ "$SCHEDULE" == '10 22 * * *' ]]; then lane=snapshot; else lane=onchain; fi
          elif [[ "$JOB" == 'snapshot' || "$JOB" == 'onchain' ]]; then
            lane="$JOB"
          else
            lane=manual
          fi
          day="${DAY:-$(date -u +%F)}"
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=ingest-complete \
            -f "client_payload[lane]=$lane" \
            -f "client_payload[date]=$day"
