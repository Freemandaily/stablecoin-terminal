[project]
name = "stableflow"
version = "0.1.0"
description = "StableFlow — stablecoin circulation observability (supply, peg, flows)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
etl = [
    "dbt-postgres>=1.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
addopts = "-q"
