[project]
name = "stableflow"
version = "0.1.0"
description = "StableFlow — stablecoin circulation observability (supply, peg, flows)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0",
    "google-cloud-bigquery>=3.47.0",
    "dbt-postgres>=1.11.0",
    "dbt-core>=1.12.6",
    "eth-utils>=6.0.0",
    "eth-hash[pycryptodome]>=0.7.0",   # keccak backend for EIP-55 (B-D37)
]

[project.optional-dependencies]
etl = [
    "dbt-postgres>=1.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/ingest/tests"]
pythonpath = ["."]           # `backend` is a namespace package at repo root
addopts = "-q"
