# dbt profiles — values come from environment (see .env.example / docker-compose)
# Usage: make dbt-run   (runs with --profiles-dir .)
stableflow:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'stableflow') }}"
      password: "{{ env_var('PGPASSWORD', 'stableflow') }}"
      dbname: "{{ env_var('PGDATABASE', 'stableflow') }}"
      schema: public
      threads: 4
      sslmode: disable
