version: 2

models:
  - name: mart_supply_daily
    description: Per-coin daily supply, issuance deltas (1/7/30d), market share — Views A/B.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - asset_id
    columns:
      - name: date
        tests:
          - not_null
      - name: total_usd
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: mart_supply_chain
    description: Per-coin per-chain supply, chain share, 30d migration delta — View A.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - asset_id
            - chain

  - name: mart_market_overview
    description: Market totals + concentration + chain mix, one row per date — View A.
    tests:
      - unique:
          column_name: date
    columns:
      - name: date
        tests:
          - not_null
      - name: total_supply_usd
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: top3_share
        tests:
          # epsilon: numeric division yields 100.00000000000000005 (float dust)
          - dbt_utils.expression_is_true:
              expression: "> 0 and top3_share <= 100.001"

  - name: mart_peg_daily
    description: USD-peg deviation per coin per day + rolling 30d stats — View C.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - asset_id
    columns:
      - name: price_usd
        tests:
          - not_null
      - name: dev_abs_bps
        tests:
          # True invariant is non-negative deviation. No upper bound: 11 real
          # long-tail "peggedUSD" coins exceed ±100% (TOR @ $20, dead coins @ 0)
          # — real market data, not transform errors (decisions B-D11).
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: mart_issuer_events
    description: P2.2 issuer events + CryptoLabel entity labels (left join; unlabeled = has_label false).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_hash
            - log_index
    columns:
      - name: has_label
        tests:
          - not_null

  - name: mart_mint_burn_daily
    description: P2.5 daily minted/burned/net per token — View F core (DESTROY counted as burn).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - token
    columns:
      - name: date
        tests:
          - not_null
      - name: minted_usd
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: burned_usd
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: net_usd
        tests:
          # net must be exactly minted − burned (both coalesced in the model)
          - dbt_utils.expression_is_true:
              expression: "= minted_usd - burned_usd"

  - name: mart_blacklist_events
    description: P2.2 freeze/unfreeze/destroy events (B-D34 canonical names) + entity labels + current per-address state — View E risk filter.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_hash
            - log_index
    columns:
      - name: blacklisted_address
        tests:
          - not_null
      # balance_raw: intentionally no not_null test — unfetched events are honest
      # NULL (P2.11) and render as `—`, never 0. balance_usd likewise; when known,
      # both are non-negative (stg_blacklist_balances tests enforce it at source).
      # is_currently_blacklisted: intentionally no not_null test — destroy-only
      # addresses have no action row, state is honest NULL (see model comment)
