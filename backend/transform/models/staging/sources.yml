sources:
  - name: raw
    schema: public
    description: Tables written directly by ingestion jobs (pre-dbt).
    tables:
      - name: load_log
        description: Ingestion run log (scripts/migrate.py → 001_init.sql).
        columns:
          - name: job
            tests:
              - not_null
          - name: status
            tests:
              - not_null
              - accepted_values:
                  values: ['running', 'success', 'failed']

      - name: raw_assets
        description: S1 metadata + current supply (ingestion/loaders.py). logo_url populated by backend/ingest/logos.py.
        columns:
          - name: logo_url
            description: >-
              TrustWallet PNG URL (B-D37), verified HTTP 200 at ingest; legacy CoinGecko
              URL (B-D26) kept where TrustWallet has no asset; null → text chip in the UI.

      - name: raw_asset_addresses
        description: >-
          B-D37 contract addresses harvested once from DeFiLlama S2
          (backend/ingest/addresses.py), PK (asset_id, chain) — input to the
          TrustWallet logo derivation in backend/ingest/logos.py.

      - name: raw_chain_current
        description: S1 per-chain current supply, PK (asset_id, chain).

      - name: raw_supply_daily
        description: S2 daily supply history, PK (date, asset_id, chain).

      - name: raw_price_daily
        description: S4 daily price history, PK (date, asset_id).

      - name: raw_market_daily
        description: S3 full-market daily totals (all tracked coins), PK (date).

      - name: raw_issuer_events
        description: >-
          P2.2 BigQuery issuer events — USDC/USDT MINT·BURN; six stables FREEZE·UNFREEZE·DESTROY (B-D34)
          (indexer/bigquery/ingest.py), PK (transaction_hash, log_index).
        columns:
          - name: blacklisted_address
            description: >-
              Target of freeze/unfreeze/destroy events (lowercase 0x, null for
              mint/burn); join key to raw_address_labels.

      - name: raw_address_labels
        description: >-
          P2.2 CryptoLabel lookups for blacklisted addresses (backend/ingest/cryptolabel.py),
          PK address. Rows with entity_name='Unknown' are attempts still awaiting an
          identification — the fetcher retries them every run until CryptoLabel names
          the entity.
        columns:
          - name: entity_name
            description: >-
              API entity name; 'Unknown' (or null) = not identified yet — counts as
              unlabeled and is retried by the fetcher.
          - name: labels
            description: Full labels JSON array from the API (can be empty for named entities).

      - name: raw_blacklist_balances
        description: >-
          P2.11 (B-D32) balanceOf() of the blacklisted address read at the event's own
          block (indexer/bigquery/enrich_balances.py, archive RPC), PK
          (transaction_hash, log_index) — 1:1 with raw_issuer_events. Only successful
          fetches are stored: no row = not yet known → renders as `—`, never 0.
        columns:
          - name: transaction_hash
            tests:
              - not_null
          - name: log_index
            tests:
              - not_null
          - name: balance_raw
            description: balanceOf() in base units (USDT/USDC both 6 decimals).
            tests:
              - not_null
              - dbt_utils.expression_is_true:
                  expression: ">= 0"
