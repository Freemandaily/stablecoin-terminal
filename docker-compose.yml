services:
  postgres:
    image: postgres:16-alpine
    container_name: sf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stableflow
      POSTGRES_PASSWORD: stableflow
      POSTGRES_DB: stableflow
    ports:
      - "5432:5432"
    volumes:
      - sf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stableflow -d stableflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    container_name: sf-backend
    restart: unless-stopped
    environment:
      PGHOST: postgres          # in-compose DNS; overrides any host .env (load_dotenv never overrides)
    ports:
      - "8081:8080"             # host 8081 (B-D18; 8080 held by user's static server)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  metabase:
    image: metabase/metabase:v0.64-lts
    container_name: sf-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - sf_metabase:/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sf_pgdata:
  sf_metabase:
